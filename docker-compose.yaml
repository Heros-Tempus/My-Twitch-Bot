services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5

  auth:
    build:
      context: .
      args:
        SERVICE_NAME: auth
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - RABBIT_CON_STRING=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      - POSTGRES_CON_STRING=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      rabbitmq:
        condition: service_healthy

  chat-listener:
    build:
      context: .
      args:
        SERVICE_NAME: chat-listener
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - RABBIT_CON_STRING=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
      auth:
        condition: service_started

  chat-writer:
    build:
      context: .
      args:
        SERVICE_NAME: chat-writer
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - RABBIT_CON_STRING=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
      auth:
        condition: service_started

  quote:
    build:
      context: .
      args:
        SERVICE_NAME: quote
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - RABBIT_CON_STRING=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      - POSTGRES_CON_STRING=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      rabbitmq:
        condition: service_healthy

  song-queue-manager:
    build:
      context: .
      args:
        SERVICE_NAME: song-queue-manager
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - RABBIT_CON_STRING=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      - POSTGRES_CON_STRING=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  song-player:
    build:
      context: .
      args:
        SERVICE_NAME: song-player
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - RABBIT_CON_STRING=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  chat-overlay:
    build:
      context: .
      args:
        SERVICE_NAME: chat-overlay
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - RABBIT_CON_STRING=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      - POSTGRES_CON_STRING=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  rabbitmq_data:
