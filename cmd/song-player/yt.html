<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <iframe 
    id="yt"
    src="" 
    allow="autoplay; encrypted-media" 
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>

  <script>
    const params = new URLSearchParams(window.location.search);
    const videoId = params.get('v');
    const iframe = document.getElementById('yt');

    if (videoId) {
      iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&origin=https://localhost`;
    }
  </script>
</body>
</html>
