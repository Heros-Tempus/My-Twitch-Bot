<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }
    #yt {
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <div id="yt"></div>

  <script>
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    const params = new URLSearchParams(window.location.search);
    const videoId = params.get('v');
    let player;
    let hasStartedPlaying = false;

    function onYouTubeIframeAPIReady() {
      if (!videoId) return;

      player = new YT.Player('yt', {
        videoId: videoId,
        playerVars: {
          'autoplay': 1,
          'origin': window.location.origin 
        },
        events: {
          'onError': onPlayerError,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerStateChange(event) {
      if (event.data === 1 && !hasStartedPlaying) {
        hasStartedPlaying = true;
        fetch('/api/track/playing', { method: 'POST' }).catch(err => console.error(err));
      }
    }

    function onPlayerError(event) {
      console.warn("YouTube Player failed. Error Code:", event.data);
      fetch('/api/track/disable', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ video_id: videoId })
      }).catch(err => console.error("Failed to report dead track:", err));
    }
  </script>
</body>
</html>
