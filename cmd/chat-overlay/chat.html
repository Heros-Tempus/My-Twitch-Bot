<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Twitch Chat Overlay</title>
    <style>
        :root {
            --text-color: #ffffff;
            --text-size: 24px;
            --text-font: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --text-weight: 700;
            --chat-bg: rgba(0, 0, 0, 0);
            --chat-fade: rgba(0, 0, 0, 0.35);
            --text-scale: 1;
        }

        body {
            background-color: transparent;
            color: var(--text-color);
            font-family: var(--text-font);
            font-size: var(--text-size);
            font-weight: var(--text-weight);
            
            text-shadow: 
                2px 2px 0 #000, 
               -1px -1px 0 #000, 
                1px -1px 0 #000, 
               -1px  1px 0 #000, 
                1px  1px 0 #000;
            
            margin: 0;
            box-sizing: border-box;
            
            width: 100vw;
            height: 100vh;
            overflow: hidden; 
        }

        #chat-container {
            display: flex;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
            gap: 12px;
            align-items: flex-start;
            background: var(--chat-bg);
            transition: background 0.25s ease;
        }

        #chat-container.has-messages {
            background: var(--chat-fade);
        }

        .message-row {
            word-wrap: break-word;
            line-height: 1.4;
            animation: slideIn 0.3s ease-out forwards;
            opacity: 1;
            transition: opacity 0.5s ease-out;
        }

        .fade-out {
            opacity: 0;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .badge {
            height: calc(24px * var(--text-scale));
            vertical-align: middle;
            margin-right: 6px;
            margin-bottom: 4px;
        }

        .message-content {
            display: inline-block;
        }

        .username {
            margin-right: 8px;
            color: var(--uname-color, #FFFFFF);
        }

        .emote {
            height: calc(32px * var(--text-scale)); 
            vertical-align: middle;
            margin: 0 2px;
        }

        .effect-upsidedown {
            transform: rotate(180deg);
            transform-origin: center;
            display: inline-block;
        }

        .effect-rainbow,
        .effect-rainbow .username {
            background-image: linear-gradient(to right, violet, indigo, blue, green, yellow, orange, red);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: none; 
            font-weight: 900;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-1deg); }
            50% { transform: translateX(5px) rotate(1deg); }
            75% { transform: translateX(-5px) rotate(-1deg); }
            100% { transform: translateX(0); }
        }

        .effect-shake {
            animation: shake 0.4s infinite;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div id="chat-container"></div>

    <script>
        const WS_URL = "ws://" + window.location.host + "/ws";

        const DEFAULTS = {
            text_color: '#ffffff',
            text_size: '24px',
            text_font: "'Segoe UI', Roboto, Helvetica, Arial, sans-serif",
            text_weight: '700',
            chat_bg: 'rgba(0, 0, 0, 0)',
            chat_fade: 'rgba(0, 0, 0, 0.35)'
        };

        const params = new URLSearchParams(window.location.search);
        const FLOW_BOTTOM_UP = params.get('flow_bottom_up') !== 'false';

        function readCssValue(name, fallback) {
            const raw = params.get(name);
            if (raw === null || raw.trim() === '') {
                return fallback;
            }

            if (name === 'text_size') {
                const value = raw.trim();
                if (/^\d+(\.\d+)?px$/i.test(value)) return value;
                if (/^\d+(\.\d+)?$/i.test(value)) return `${value}px`;
                return fallback;
            }

            if (name === 'text_weight') {
                return /^(normal|bold|bolder|lighter|[1-9]?[0-9]0)$/.test(raw.trim()) ? raw.trim() : fallback;
            }

            return raw.trim();
        }

        function applyCssOverrides() {
            const root = document.documentElement;
            const textSize = readCssValue('text_size', DEFAULTS.text_size);
            const textScale = Number.parseFloat(textSize) / 24 || 1;

            root.style.setProperty('--text-color', readCssValue('text_color', DEFAULTS.text_color));
            root.style.setProperty('--text-size', textSize);
            root.style.setProperty('--text-font', readCssValue('text_font', DEFAULTS.text_font));
            root.style.setProperty('--text-weight', readCssValue('text_weight', DEFAULTS.text_weight));
            root.style.setProperty('--chat-bg', readCssValue('chat_bg', DEFAULTS.chat_bg));
            root.style.setProperty('--chat-fade', readCssValue('chat_fade', DEFAULTS.chat_fade));
            root.style.setProperty('--text-scale', String(textScale));
        }
        
        const MESSAGE_TIMEOUT_SEC = (() => {
            const raw = params.get("message_timeout_sec");
            const value = Number(raw);
            return Number.isFinite(value) && value >= 0 ? value : 15;
        })();

        const MAX_MESSAGES = (() => {
            const raw = params.get("max_messages");
            const value = Number(raw);
            return Number.isFinite(value) && value > 0 ? value : 50;
        })();

        const container = document.getElementById('chat-container');

        applyCssOverrides();

        function updateChatBackground() {
            const hasMessages = container.children.length > 0;
            container.classList.toggle('has-messages', hasMessages);
        }

        if (FLOW_BOTTOM_UP) {
            container.style.flexDirection = 'column';
            container.style.justifyContent = 'flex-end';
        } else {
            container.style.flexDirection = 'column';
            container.style.justifyContent = 'flex-start';
        }

        function connectWebSocket() {
            console.log("Attempting to connect to backend at " + WS_URL);
            const ws = new WebSocket(WS_URL);

            ws.onopen = () => console.log("Connected to Chat Overlay Backend!");

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    renderMessage(data);
                } catch (e) {
                    console.error("Failed to parse message data:", e);
                }
            };

            ws.onclose = () => {
                console.log("Disconnected. Reconnecting in 3 seconds...");
                setTimeout(connectWebSocket, 3000);
            };

            ws.onerror = (err) => ws.close();
        }

        function renderMessage(data) {
            const row = document.createElement('div');
            row.className = 'message-row';

            const content = document.createElement('div');
            content.className = 'message-content';
            if (data.effects && data.effects.length > 0) {
                data.effects.forEach(effectClass => content.classList.add(effectClass));
            }

            if (data.badges && data.badges.length > 0) {
                data.badges.forEach(badge => {
                    if (badge.image_url) {
                        const img = document.createElement('img');
                        img.className = 'badge';
                        img.src = badge.image_url;
                        img.alt = badge.set_id;
                        content.appendChild(img);
                    }
                });
            }

            const userSpan = document.createElement('span');
            userSpan.className = 'username';
            userSpan.style.setProperty('--uname-color', data.color || '#FFFFFF');
            userSpan.innerText = data.display_name + ':';
            content.appendChild(userSpan);

            if (data.fragments) {
                data.fragments.forEach(frag => {
                    if (frag.type === 'text') {
                        const textNode = document.createTextNode(frag.text);
                        content.appendChild(textNode);
                    } else if (frag.type === 'emote') {
                        const img = document.createElement('img');
                        img.className = 'emote';
                        img.alt = frag.text;
                        if (frag.image_url) {
                            img.src = frag.image_url;
                        } else if (frag.emote_id) {
                            img.src = `https://static-cdn.jtvnw.net/emoticons/v2/${frag.emote_id}/default/dark/3.0`;
                        }
                        content.appendChild(img);
                    }
                });
            }

            row.appendChild(content);

            if (FLOW_BOTTOM_UP) {
                container.appendChild(row);
                row.scrollIntoView({ behavior: 'smooth', block: 'end' });
            } else {
                container.prepend(row);
            }
            updateChatBackground();
            setTimeout(() => {
                row.classList.add('fade-out');
                
                setTimeout(() => {
                    if (row.parentNode === container) {
                        container.removeChild(row);
                        updateChatBackground();
                    }
                }, 500); 
                
            }, MESSAGE_TIMEOUT_SEC * 1000);

            while (container.children.length > MAX_MESSAGES) {
                if (FLOW_BOTTOM_UP) {
                    container.removeChild(container.firstChild);
                } else {
                    container.removeChild(container.lastChild);
                }
            }
        }

        connectWebSocket();
    </script>
</body>
</html>
